[project]
name = "outpost-backend"
version = "0.1.0"
description = "Outpost — daily browser-based narrative roguelike backend."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "anthropic>=0.96.0",
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "langchain-core>=1.3.1",
    "langfuse>=4.5.0",
    "langgraph>=1.1.9",
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg[binary,pool]>=3.3.3",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "pyjwt>=2.12.1",
    "pyyaml>=6.0",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.26",
    "slowapi>=0.1.9",
    "sqlalchemy[asyncio]>=2.0.49",
    "structlog>=25.5.0",
    "uvicorn[standard]>=0.46.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "jsonschema>=4.20",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.15.11",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
# B008: Depends()/Query()/etc. in argument defaults is the canonical
# FastAPI pattern — flagging it is a well-known false positive.
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: real-LLM integration tests (slow, costs tokens)",
    "eval: simulated-game evaluation tests (slow, costs LLM tokens)",
]
