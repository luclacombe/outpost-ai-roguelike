id: desert_outpost_v1
name: Carmine Junction

palette_accent: "#8c4a4a"

lore: |
  The truck stop on Route 9 had a name before the collapse. Now it's called
  Carmine Junction because the soil here is the color of old blood and because
  the people who settled it needed to call it something. The well works. The
  fuel pumps do not. The highway runs east and west and people come from both
  directions, some of them with things to trade and some of them with other
  plans.

  You took the job because someone had to hold it. The shelter holds eighteen
  if no one complains about the beds. The water is clean, which puts you above
  most of what's left. There is a locked room in the back that the previous
  owner said not to open. The mechanic opened it on the second day. Neither of
  them has said what was inside.

narrative_voice: |
  American Southwest gothic. Short sentences. The weather is always present —
  heat, dust, the specific quality of light at dusk. People do not explain
  themselves; they act. Violence is not telegraphed; it arrives. Moral weight
  comes from what is not said. Reference McCarthy's cadence: no quotation marks
  for dialogue when the prose can carry it.

player_title: Warden
lexicon: [Carmine, Junction, Doc]

