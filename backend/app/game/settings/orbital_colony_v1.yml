id: orbital_colony_v1
name: Helios-7

palette_accent: "#6c4a8c"

lore: |
  Helios-7 was designed as a science relay station. That was the plan.
  Then Earth went quiet at MET 03:14:07:22 and the plan became irrelevant.
  Fourteen months of silence. The other two stations are still broadcasting
  but neither is answering questions. The garden bay runs at sixty percent
  yield. The oxygen recyclers need a part that was supposed to arrive on
  the last resupply that never came.

  Seven crew members. Enough food for eleven months if rationed strictly,
  eight if anyone stops being strict. There is a signal originating from
  the surface. It started three weeks after the silence. No one agrees on
  what it means. The AI Specialist says the pattern is deliberate. The
  Commander says it does not matter what it means if they cannot reach it.

narrative_voice: |
  Clinical and systems-oriented. Measure time in MET — Mission Elapsed Time.
  Emotional content arrives through log entries and maintenance notes, not
  direct statement. Crew humor is dry and specific to the job: a joke about
  thruster calculations, not about death. State facts without editorializing.
  The station does not mourn; it logs anomalies.

player_title: Director
lexicon: [Helios, HELO, MET, Earth]

