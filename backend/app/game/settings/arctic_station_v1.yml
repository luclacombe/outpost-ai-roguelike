id: arctic_station_v1
name: Vorgrad Station

palette_accent: "#4a6c8c"

lore: |
  Vorgrad Station was built in 1978 to monitor ice-sheet drift. It was
  abandoned in 1992. Someone reactivated it eighteen months ago — the
  paperwork says your government, but the funding trail disagrees. The
  heating core is original Soviet engineering. So is the commissar.

  Eight people came north. Three left before winter. The five who stayed
  each had a reason that made sense at the time. The ice is two kilometers
  thick beneath you. The nearest settlement is four hundred kilometers east.
  Somewhere in the archive room there are files marked СЕКРЕТНО that no one
  has opened yet. The station hums. The wind does not stop.

narrative_voice: |
  Cold, sparing prose. Short declarative sentences. Second-person address
  to the Director. Cyrillic proper nouns where natural — station designations,
  archive labels, equipment codes. Never sentimental. Occasionally dryly funny
  in the way exhausted people are funny. The setting is not romantic; it is a
  workplace that happens to be lethal.

player_title: Director
lexicon: [Vorgrad]

