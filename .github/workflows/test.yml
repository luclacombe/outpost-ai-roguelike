name: Test

# Fast unit tests for backend (mocked LLM, mocked Postgres) and frontend
# (lint + production build). Runs on PRs to main and on every push to main.
# Real-LLM eval lives in `eval.yml`; deploy lives in `deploy.yml`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Sync deps
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check app/

      - name: Ruff format check
        run: uv run ruff format --check app/

      - name: Pytest (unit, mocked LLM)
        # Default markers exclude `integration` and `eval`. DB-touching tests
        # SKIP when Postgres is unreachable (see backend/CLAUDE.md), so this
        # job runs without spinning up a Postgres service.
        run: uv run pytest tests/ -v -m "not eval and not integration" --tb=short

  test-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        # Public NEXT_PUBLIC_* env vars are baked into the bundle. Use
        # placeholder URLs so the build succeeds without Vercel-side secrets;
        # the real Vercel deploy injects production values.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          NEXT_PUBLIC_API_BASE_URL: https://example.com
        run: pnpm build
